name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/*"
  workflow_dispatch:

jobs:
  check-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run checks and tests
        run: ./gradlew check --no-daemon

      - name: Assemble Android sample
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Web compilation
        run: ./gradlew :sample:shared:compileKotlinWasmJs :sample:shared:compileKotlinJs --no-daemon

      - name: Verify Dokka documentation generation
        run: ./gradlew dokkaGenerateHtml --no-daemon
